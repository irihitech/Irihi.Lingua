name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  native-aot:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        framework: [net8.0, net10.0]
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Publish NativeAOT smoke executable
        run: dotnet publish test/Irihi.Lingua.AotSmoke/Irihi.Lingua.AotSmoke.csproj -c Release -f ${{ matrix.framework }} -r ${{ matrix.rid }} -o artifacts/aot-smoke
      - name: Run NativeAOT smoke checks
        shell: pwsh
        run: |
          if ($IsWindows) {
            & ./artifacts/aot-smoke/Irihi.Lingua.AotSmoke.exe
          } else {
            & ./artifacts/aot-smoke/Irihi.Lingua.AotSmoke
          }
          exit $LASTEXITCODE

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Run tests
        run: dotnet test Irihi.Lingua.slnx --configuration Release

  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Run tests
        run: dotnet test Irihi.Lingua.slnx --configuration Release --results-directory TestResults --logger trx --collect:"XPlat Code Coverage"
      - name: Combine Coverage Reports
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: "TestResults/**/coverage.cobertura.xml"
          targetdir: "${{ github.workspace }}/CoverageReport"
          reporttypes: "HtmlInline;Cobertura"
      - name: Publish Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: "CoverageReport/Cobertura.xml"
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: false
          indicators: true
          output: both
          thresholds: "10 30"
      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v3
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          recreate: true
          path: code-coverage-results.md
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            CoverageReport/**
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
          retention-days: 5
